[pytest]
# NOTE: a standalone pytest.ini MUST use the [pytest] section header.
# The previous [tool:pytest] header (valid only inside setup.cfg / pyproject.toml)
# caused pytest to silently ignore every setting below — including asyncio_mode,
# without which the async test suite does not run.
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
# Coverage is measured in CI (see .github/workflows/tests.yml) rather than in the
# always-on addopts, so a partial local run (e.g. `pytest tests/test_chunker.py`)
# is not forced to install pytest-cov or clear a repo-wide coverage floor.
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests (may take several seconds)
    models: Model-specific tests
    api: API endpoint tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
