[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "fin-ai-agent"
version = "0.1.0"
description = "Production-grade Financial Complaint Resolution AI Agent with Enhanced RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Orchestration
    "langgraph==0.2.28",
    "langchain==0.3.7",
    "langchain-core==0.3.15",
    "langchain-openai==0.2.5",
    "langchain-community==0.3.5",

    # LLM providers
    "openai==1.54.0",
    "anthropic==0.36.2",

    # Embeddings & Vector Store
    "qdrant-client==1.11.3",
    "langchain-qdrant==0.2.0",
    "sentence-transformers==3.3.0",
    "tiktoken==0.8.0",

    # Reranking
    "flashrank==0.2.9",
    "cohere==5.11.0",

    # Document ingestion
    "pypdf==5.1.0",
    "unstructured==0.16.5",
    "pandas==2.2.3",
    "numpy==2.1.3",

    # API layer
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",

    # Observability
    "langfuse==2.53.3",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "prometheus-client==0.21.0",

    # Guardrails & Evaluation
    "ragas==0.2.6",
    "guardrails-ai==0.5.14",

    # Database
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.0",

    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # Utilities
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "rich==13.9.4",
    "typer==0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.7.3",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[project.scripts]
fin-agent = "app.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
