global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Financial AI Agent API
  - job_name: 'fin-ai-api'
    static_configs:
      - targets: ['fin_api:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    
  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
      
  # Postgres metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
      
  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
      
  # Qdrant metrics
  - job_name: 'qdrant'
    static_configs:
      - targets: ['fin_qdrant:6333']
    metrics_path: '/metrics'