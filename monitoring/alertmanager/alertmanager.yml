global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@finai-agent.com'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/critical-alerts'
        title: 'Critical Alert: Financial AI Agent'
        text: |
          Alert: {{ .GroupLabels.alertname }}
          Instance: {{ .GroupLabels.instance }}
          Summary: {{ .CommonAnnotations.summary }}
          Description: {{ .CommonAnnotations.description }}

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/warning-alerts'
        title: 'Warning: Financial AI Agent'
        text: |
          Alert: {{ .GroupLabels.alertname }}
          Instance: {{ .GroupLabels.instance }}
          Summary: {{ .CommonAnnotations.summary }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']