# docker-compose.prod.yml — Production configuration
# Optimized builds, no dev tools, production-grade settings
#
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# =============================================================================

services:

  api:
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: info
    # Remove source mounts — use baked-in image only
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always

  frontend:
    # Force production Dockerfile (nginx-based)
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.fin-ai.local/api/v1
    # Map to standard port 3000
    ports:
      - "3000:80"
    # Remove dev volumes
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: always

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  qdrant:
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: always

