version: '3.8'
services:
  financial-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-agent:latest
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: always
    networks:
      - prod-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: financial_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - prod-network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - prod-network

networks:
  prod-network:

volumes:
  postgres_data:
